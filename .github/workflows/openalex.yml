name: Weekly OpenAlex Literature Check

# Looks for new research on Xylella fastidiosa in OpenAlex and opens one GitHub
# issue listing the new works, so they can be skimmed for outbreaks to add to
# official_outbreaks.json. The first run only records what already exists.
# Uses the OPENALEX_API_KEY repository secret for a larger daily allowance.

on:
  schedule:
    - cron: '23 7 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: xylella-openalex
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check OpenAlex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python openalex_check.py
      - name: Save what has been seen
        run: |
          set -e
          git config user.name "Automated Satellite Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openalex_seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "OpenAlex check: update seen works"
            git pull --rebase origin main
            git push origin main
          fi
