name: Weekly EPPO Check

# Looks for new Xylella fastidiosa articles and country-status changes on the
# EPPO Global Database and opens a GitHub issue for each, so they can be
# reviewed and added to official_outbreaks.json / country_status.json.
# The first run only records what already exists.

on:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: xylella-eppo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check EPPO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python eppo_check.py
      - name: Save what has been seen
        run: |
          set -e
          git config user.name "Automated Satellite Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eppo_seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "EPPO check: update seen reports"
            git pull --rebase origin main
            git push origin main
          fi
