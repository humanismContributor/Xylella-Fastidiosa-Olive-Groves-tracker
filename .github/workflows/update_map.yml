name: Weekly Xylella Scan

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# FORCE ALL STEPS TO USE THE CORRECT GEOSPATIAL ENVIRONMENT
defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      
      - name: Set up Mambaforge (Geospatial Environment)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: xylella_env
          channels: conda-forge,defaults
          python-version: "3.10"
          architecture: "x64"

      - name: Install Geospatial Python Packages
        run: |
          mamba install -y geopandas rasterio shapely scikit-image pystac-client odc-stac

      - name: Run Satellite Scanner Analysis
        run: |
          python xylella_scanner.py
        
      - name: Commit and Save Generated Map Data
        run: |
          git config user.name "Automated Satellite Bot"
          git config user.email "satellite-bot@://github.com"
          
          if [ -f xylella_risk_zones.geojson ]; then
            git add xylella_risk_zones.geojson
            git diff-index --quiet HEAD || git commit -m "Automated Sync: Updated regional Xylella risk polygons"
            git push origin main
          else
            echo "No anomalies detected during this run cycle."
          fi
