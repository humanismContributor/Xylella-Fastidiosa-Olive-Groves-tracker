name: Weekly Xylella Scan

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Never let two scans write to the repository at the same time
concurrency:
  group: xylella-scan
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Read the list of enabled regions from regions.json
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List enabled regions
        id: list
        run: echo "regions=$(jq -c '[.regions[] | select(.enabled != false) | .id]' regions.json)" >> "$GITHUB_OUTPUT"

  # Scan each region in its own job (the first run rebuilds every summer since 2017)
  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Mambaforge (Geospatial Environment)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: xylella_env
          channels: conda-forge
          python-version: "3.11"

      - name: Install Geospatial Python Packages
        run: |
          mamba install -y numpy scipy xarray dask rasterio pystac-client odc-stac odc-geo planetary-computer

      - name: Run Satellite Scanner (${{ matrix.region }})
        run: |
          python xylella_scanner.py --region "${{ matrix.region }}"

      - name: Keep the results for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: data/${{ matrix.region }}/
          retention-days: 7

  # Collect every region's results and commit them in one go
  publish:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download region results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: region-*
          path: artifacts

      - name: Copy results into data/
        run: |
          shopt -s nullglob
          for dir in artifacts/region-*; do
            id="${dir#artifacts/region-}"
            mkdir -p "data/$id"
            cp -r "$dir"/. "data/$id"/
            echo "Updated data/$id"
          done

      - name: Commit and Save Generated Map Data
        run: |
          set -e
          git config user.name "Automated Satellite Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Sync: Updated Xylella decline zones"
            git pull --rebase origin main
            git push origin main
          fi
